version: 2.1

jobs:
  cobra:
    docker:
      # Newest Go in the repo's test matrix (.github/workflows/test.yml goes up to 1.24.x).
      - image: cimg/go:1.24
    environment:
      GO111MODULE: "on"
    steps:
      - checkout

      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "go.sum" }}
            - go-mod-v1-

      - run:
          name: Download dependencies
          command: go mod download

      - save_cache:
          key: go-mod-v1-{{ checksum "go.sum" }}
          paths:
            - /home/circleci/go/pkg/mod

      - run:
          name: Test
          command: make test

      - run:
          name: Install golangci-lint
          # Not bundled in cimg/go; installed with the Go toolchain already in the image.
          command: |
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
              | sh -s -- -b "$(go env GOPATH)/bin"
            golangci-lint --version

      - run:
          name: Lint
          command: make lint

workflows:
  build-test-lint:
    jobs:
      - cobra
